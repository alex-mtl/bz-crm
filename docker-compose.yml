name: bz-crm-social

x-app: &app
  build:
    context: ./docker/php
  image: bz-crm-social/app:dev
  volumes:
    - ./:/var/www/html
    # Heavy, container-only trees on named volumes: bind mounts from a Windows drive are ~100x slower.
    - vendor:/var/www/html/vendor
    - framework:/var/www/html/storage/framework
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [bz]

services:
  app:
    <<: *app

  queue:
    <<: *app
    command: php artisan queue:work redis --queue=default --tries=3 --timeout=120
    restart: unless-stopped

  scheduler:
    <<: *app
    command: php artisan schedule:work
    restart: unless-stopped

  # WebSocket server of the messenger (ADR-012). Browsers connect to the published port;
  # the application publishes to it inside the network as reverb:8080.
  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_CLIENT_PORT:-8180}:8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8100}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [bz]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${DB_DATABASE:-bz_crm}"
      MYSQL_USER: "${DB_USERNAME:-bz_crm}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${FORWARD_DB_PORT:-3316}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [bz]

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [bz]

  # Antivirus for uploaded files (ADR-012). Optional: `docker compose --profile antivirus up -d clamav`
  # and ATTACHMENT_SCANNER=clamav in .env. The first start downloads the signature databases (a few minutes).
  clamav:
    image: clamav/clamav:stable
    profiles: [antivirus]
    volumes:
      - clamav-data:/var/lib/clamav
    restart: unless-stopped
    networks: [bz]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8126}:8025"
    networks: [bz]

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
      # The Filament theme imports CSS from vendor/, so Node must see the same vendor as PHP.
      - vendor:/var/www/html/vendor:ro
    command: sh -c "npm install && npm run dev"
    ports:
      - "${VITE_PORT:-5174}:5174"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    networks: [bz]

networks:
  bz:

volumes:
  mysql-data:
  redis-data:
  clamav-data:
  vendor:
  framework:
  node_modules:
